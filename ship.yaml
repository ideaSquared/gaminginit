# How this repo deploys. Read by ideaSquared/shipper's reusable workflow (see its README).
product: gaminginit
# ideaSquared bot project: the deploy message goes to its gaminginit-github channel.
discord: gaminginit
checks: [test]
# `ship deploy gaminginit` starts this workflow (it runs the tests, then deploys main).
dispatch:
  workflow: ci.yml
environments:
  production: {}
components:
  site:
    type: cloudflare-worker
    # Polled after each deploy; if the home page never answers, the Worker is rolled back.
    health: /
